openapi: 3.1.0
info:
  title: Gestionale ripetizioni — subset sperimentale
  version: 0.7.0
  description: 'Contratto manuale del subset sperimentale v0.5. Sessione/CSRF. Bridge DB e job dev-only (DEBUG ed
    EXPERIMENTAL_DB_PLANNING), nessuna pubblicazione. Non baseline approvata G1/G2/G3. Payload/enum non supportati
    rifiutati; PATCH configurazione con versione attesa. Schemi configurazione derivati dai serializer; altri subset
    manuali. V0.5: calendario sperimentale del solo centro, PG UTF8 con trigger e flag esplicito. Produzione disabilitata.
    Publishable=false si riferisce alla produzione; experimental_publish_available separato. Registro eventi senza
    delivery/email.'
servers:
- url: /api/v1
paths:
  /health:
    get:
      operationId: health
      description: Liveness applicativa, non readiness DB o sicurezza di produzione.
      security: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
  /auth/csrf:
    get:
      operationId: csrf
      description: Imposta il cookie csrftoken. Inviare X-CSRFToken per POST inclusi login e logout.
      security: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
  /auth/login:
    post:
      operationId: login
      description: Login email/password (s1). Con MFA obbligatoria risponde mfa_required=true e la sessione resta
        in attesa di /auth/mfa/verify o /auth/mfa/confirm; con più contesti può chiedere context_required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCommand'
      responses:
        '200':
          description: Successo o MFA richiesta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: INVALID_PAYLOAD
        '401':
          description: INVALID_CREDENTIALS
        '429':
          description: RATE_LIMITED con Retry-After
  /auth/logout:
    post:
      operationId: logout
      description: Sessione eliminata; CSRF sempre obbligatorio.
      security: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
  /me:
    get:
      operationId: me
      description: ''
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
  /planning/readiness:
    get:
      operationId: planningReadiness
      description: 'Solo centro. ready rimane false: pianificatore non implementato.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
  /schedule-runs:
    post:
      operationId: queueDatabaseRun
      description: Solo centro e due flag sviluppo; risposta 202 dopo commit DB, broker post-commit. Una settimana
        locale. Nessun calendario pubblico.
      security: &id003
      - sessionCookie: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseRunCommand'
      responses:
        '202':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseQueuedRun'
        '400':
          description: Payload/chiave non valido
        '403':
          description: Vietato
        '404':
          description: Policy non trovata
        '409':
          description: Revisione obsoleta o chiave riutilizzata con body diverso
        '422':
          description: Dati incompleti o vincolo non supportato
        '503':
          description: Disabilitato fuori sviluppo
  /students/:
    get:
      operationId: listStudent
      description: 'Scope server prima della paginazione. Risorse e decisioni: solo centro. Nessun filtro custom
        o cursor normativo in v0.1.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageStudent'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
  /students/{id}/:
    parameters:
    - name: id
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
    get:
      operationId: retrieveStudent
      description: ''
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
        '404':
          description: Oggetto non esistente o fuori scope
  /tutors/:
    get:
      operationId: listTutor
      description: 'Scope server prima della paginazione. Risorse e decisioni: solo centro. Nessun filtro custom
        o cursor normativo in v0.1.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTutor'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
  /tutors/{id}/:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id001
    get:
      operationId: retrieveTutor
      description: ''
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tutor'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
        '404':
          description: Oggetto non esistente o fuori scope
  /resources/:
    get:
      operationId: listResource
      description: 'Scope server prima della paginazione. Risorse e decisioni: solo centro. Nessun filtro custom
        o cursor normativo in v0.1.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResource'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
    post:
      operationId: createResource
      description: Solo centro (v0.10). Aula (SPACE, capienza >= 1) o canale video (VIDEO_CHANNEL, capienza
        null).
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceWrite'
      responses:
        '201':
          description: Creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          description: Dati non validi
        '403':
          description: Solo centro
        '409':
          description: DATA_CONFLICT (nome già usato)
  /resources/{id}/:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id001
    get:
      operationId: retrieveResource
      description: ''
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
        '404':
          description: Oggetto non esistente o fuori scope
    patch:
      operationId: updateResource
      description: Solo centro (v0.10). Modifica parziale; expected_version facoltativa. Nessuna eliminazione,
        si disattiva con active=false.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ResourceWrite'
              - type: object
                properties:
                  expected_version:
                    type: integer
      responses:
        '200':
          description: Aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          description: Dati non validi
        '403':
          description: Solo centro
        '409':
          description: VERSION_CONFLICT o DATA_CONFLICT
  /teaching-requests/:
    get:
      operationId: listTeachingRequest
      description: 'Scope server prima della paginazione. Risorse e decisioni: solo centro. Nessun filtro custom
        o cursor normativo in v0.1.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTeachingRequest'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
  /teaching-requests/{id}/:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id001
    get:
      operationId: retrieveTeachingRequest
      description: ''
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRequest'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
        '404':
          description: Oggetto non esistente o fuori scope
  /availability-rules/:
    get:
