      - sessionCookie: []
      description: 'Elimina un impegno.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Eliminato
        '403':
          description: Permesso negato
        '404':
          description: Non trovato
  /planner/plans:
    get:
      operationId: getMonthPlanning
      tags:
      - planner
      security:
      - sessionCookie: []
      description: 'Stato del mese (?month=YYYY-MM): readiness, bozza, pubblicato, conferme, giorni chiusi.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Dati non validi
        '403':
          description: Permesso negato
    post:
      operationId: generateMonthPlan
      tags:
      - planner
      security:
      - sessionCookie: []
      description: 'Genera la bozza del mese con il motore CP-SAT (orari/chiusure rigidi, sforamento impegni entro tolleranza).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Creato
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Dati non validi
        '403':
          description: Permesso negato
        '409':
          description: Conflitto di stato
  /planner/plans/{id}:
    get:
      operationId: getAutoPlan
      tags:
      - planner
      security:
      - sessionCookie: []
      description: 'Dettaglio bozza/piano con lezioni, sforamenti e lezioni non collocate.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Permesso negato
        '404':
          description: Non trovato
  /planner/plans/{id}/publish:
    post:
      operationId: publishAutoPlan
      tags:
      - planner
      security:
      - sessionCookie: []
      description: 'Pubblica la bozza: lezioni senza sforamenti in calendario, le altre in attesa di conferma (email + notifica).'
      parameters:
