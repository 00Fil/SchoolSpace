      - roles
      - tutor_id
      - experimental
      additionalProperties: false
    Student:
      type: object
      properties:
        id: *id001
        display_name: *id008
        level: *id008
        active:
          type: boolean
        version:
          type: integer
      required:
      - id
      - display_name
      - level
      - active
      - version
      additionalProperties: false
    Tutor:
      type: object
      properties:
        id: *id001
        display_name: *id008
        version:
          type: integer
      required:
      - id
      - display_name
      - version
