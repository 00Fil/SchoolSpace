          type:
          - integer
          - 'null'
        active:
          type: boolean
        version:
          type: integer
      required:
      - id
      - name
      - kind
      - student_capacity
      - active
      - version
      additionalProperties: false
    TeachingRequest:
      type: object
      properties:
        id: *id001
        student: &id028
          type:
          - string
          - 'null'
          format: uuid
        subject_name: *id008
        duration_minutes:
          type: integer
          enum:
          - 60
          - 90
          - 120
        sessions_per_week:
          type: integer
          minimum: 1
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        version:
          type: integer
        target_type:
          type: string
          enum:
          - STUDENT
          - GROUP
        participant_ids:
          type: array
          items: *id002
          description: Solo gli studenti visibili al richiedente, non tutti i membri del gruppo
        mode:
          type: string
          enum:
          - ''
          - IN_PERSON
          - ONLINE
        kind:
          type: string
          enum:
          - SINGLE
          - SERIES
          - WEEKLY
          description: 'v0.9.6. SINGLE: una lezione (giorno con o senza fixed_time, oppure una settimana).
            SERIES: ricorrente, sessions_per_week lezioni ogni settimana tra period_start e period_end, sempre con lo stesso tutor (REQUIRED).
            WEEKLY: domanda settimanale storica e derivata dai percorsi parentali.'
        fixed_time:
          type:
          - string
          - 'null'
          description: HH:MM:SS, solo per SINGLE in un giorno (period_start == period_end)
        planning_state:
          type: string
          enum:
          - ''
          - REVIEW
          - DONE
          description: 'v0.9.9. REVIEW: il motore ha inserito le lezioni, il centro deve verificarle. DONE: verificata e completata.'
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        group_label:
          type: string
          description: v0.9.9. Nome della lezione di gruppo creata dal centro (vuoto per le lezioni individuali)
        participant_names:
          type: array
          items:
            type: string
      required:
      - id
