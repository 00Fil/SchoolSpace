  /planner/closures/{id}:
    delete:
      operationId: deletePlannerClosure
      tags:
      - planner
      security:
      - sessionCookie: []
      description: 'Elimina una chiusura; 409 per le pause dell anno scolastico.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Eliminato
        '403':
          description: Permesso negato
        '404':
          description: Non trovato
        '409':
          description: Conflitto di stato
  /commitments:
    get:
      operationId: listCommitments
      tags:
      - planner
      security:
      - sessionCookie: []
      description: 'Impegni di studenti e tutor visibili all utente (genitore: figli; tutor: propri; centro: tutti).'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Permesso negato
    post:
      operationId: createCommitments
      tags:
      - planner
      security:
      - sessionCookie: []
      description: 'Crea impegni settimanali (weekdays multipli) o occasionali.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Creato
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Dati non validi
        '403':
          description: Permesso negato
  /commitments/{id}:
