      description: 'Scope server prima della paginazione. Risorse e decisioni: solo centro. Nessun filtro custom
        o cursor normativo in v0.1.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAvailability'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
    post:
      operationId: createAvailabilityDraft
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityCreate'
      responses:
        '201':
          description: Bozza creata, nessuna prenotazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          description: Validazione campi/delega/FK fallita; campi extra o read-only rifiutati
        '403':
          description: Sessione o CSRF assente
        '429':
          description: Limite richieste
      description: status/author/version vengono stabiliti dal server. PATCH e DELETE non disponibili.
  /availability-rules/{id}/:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id001
    get:
      operationId: retrieveAvailability
      description: ''
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
        '404':
          description: Oggetto non esistente o fuori scope
  /decisions/:
    get:
      operationId: listDecision
      description: 'Scope server prima della paginazione. Risorse e decisioni: solo centro. Nessun filtro custom
        o cursor normativo in v0.1.'
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDecision'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
  /decisions/{id}/:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id001
    get:
      operationId: retrieveDecision
      description: ''
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '403':
          description: Accesso richiesto o azione vietata
        '429':
          description: Limite di richieste
        '404':
          description: Oggetto non esistente o fuori scope
  /subjects/:
    get:
      operationId: listSubject
      description: Creazione solo centro. GET filtrato sullo studente autorizzato.
      security:
      - sessionCookie: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageSubject'
        '403':
          description: Accesso vietato
    post:
      operationId: createSubject
      description: 'Creazione solo centro. GET filtrato sullo studente autorizzato. Campi read-only/extra rifiutati.
        Per blocchi: student XOR group; periodi e monte minuti verificati. Percorsi già derivati sono congelati.'
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreate'
      responses:
        '201':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          description: Validazione payload
        '403':
          description: Solo centro / sessione o CSRF assente
        '409':
          description: Curriculum congelato o conflitto dati
        '422':
          description: Vincolo didattico violato
  /subjects/{id}/:
    parameters:
    - name: id
      in: path
      required: true
      schema: &id002
        type: string
        format: uuid
    get:
      operationId: retrieveSubject
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '403':
          description: Azione vietata
        '404':
          description: Oggetto inesistente o fuori scope
    patch:
      operationId: updateSubject
      description: Solo centro (v0.9.6). Rinomina, descrizione, archiviazione (active=false) o riattivazione.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreate'
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          description: Nome vuoto o già usato
        '403':
          description: Solo centro
    delete:
      operationId: deleteSubject
      description: Solo centro (v0.9.6). Solo per materie mai usate; altrimenti 409 SUBJECT_IN_USE (archiviare).
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Eliminata
        '403':
          description: Solo centro
        '409':
          description: Materia in uso
  /subjects/overview/:
    get:
      operationId: subjectsOverview
      description: Solo centro (v0.9.6). Scheda di ogni materia con tutor competenti, richieste in corso e percorsi.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
        '403':
          description: Solo centro
  /planner/setup:
    get:
      operationId: getPlannerSetup
      tags:
      - planner
      security:
      - sessionCookie: []
      description: 'Dati di base del pianificatore mensile (v0.9.7): aule, tolleranza, studenti e tutor visibili.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Permesso negato
  /planner/opening-hours:
    get:
      operationId: getOpeningHours
      tags:
      - planner
      security:
      - sessionCookie: []
      description: 'Fasce di apertura settimanali e chiusure. Leggibile da ogni utente autenticato.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Permesso negato
    put:
      operationId: putOpeningHours
      tags:
      - planner
      security:
      - sessionCookie: []
      description: 'Sostituisce le fasce di apertura (solo gestione centro). Vincolo rigido del motore.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Dati non validi
        '403':
          description: Permesso negato
  /planner/closures:
    post:
      operationId: createPlannerClosure
      tags:
      - planner
      security:
      - sessionCookie: []
      description: 'Crea ferie/chiusura (data o intervallo). Vincolo rigido.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
