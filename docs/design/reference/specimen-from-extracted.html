<script>
(() => {
'use strict';
/* ================= utilità ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = id => `<svg class="i" aria-hidden="true"><use href="#${id}"/></svg>`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const OPEN = 14 * 60, STEP = 30, SLOTS = 12;
const LOC = 'it-IT';
const fTime = new Intl.DateTimeFormat(LOC, { hour: '2-digit', minute: '2-digit' });
const fDay = new Intl.DateTimeFormat(LOC, { weekday: 'long', day: 'numeric', month: 'long' });
const fDayShort = new Intl.DateTimeFormat(LOC, { weekday: 'short', day: 'numeric', month: 'short' });
const fWd = new Intl.DateTimeFormat(LOC, { weekday: 'short' });
const fWdNarrow = new Intl.DateTimeFormat(LOC, { weekday: 'narrow' });
const fWdLong = new Intl.DateTimeFormat(LOC, { weekday: 'long' });
const fDM = new Intl.DateTimeFormat(LOC, { day: 'numeric', month: 'long' });
const fMonth = new Intl.DateTimeFormat(LOC, { month: 'long' });
const fRel = new Intl.RelativeTimeFormat(LOC, { numeric: 'auto' });
const money = new Intl.NumberFormat(LOC, { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const pct = new Intl.NumberFormat(LOC, { style: 'percent', maximumFractionDigits: 0 });
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const minDate = min => { const d = new Date(2000, 0, 1); d.setMinutes(min); return d; };
const tm = min => fTime.format(minDate(min));
const slotMin = s => OPEN + s * STEP;
const range = (l) => `${tm(slotMin(l.start))}–${tm(slotMin(l.start + l.len))}`;
const durTxt = len => { const h = Math.floor(len / 2), hs = h === 1 ? '1 ora' : `${h} ore`; return len % 2 === 0 ? hs : (h === 0 ? '30 minuti' : `${hs} e 30 minuti`); };
const dayLabel = s => cap(fDay.format(parse(s)));
const mondayOf = s => { const d = parse(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return iso(d); };
const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const TODAY = iso(new Date());
const T0 = Date.now();
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const motionOK = () => !matchMedia('(prefers-reduced-motion: reduce)').matches && S.settings.motion !== 'reduce';
const hash = str => { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const SPRING = 'cubic-bezier(.32,.72,0,1)';
const EASE = 'cubic-bezier(.2,.8,.2,1)';

/* ================= dati ================= */
const KEY = 'lumen-v4';
function seed() {
  const tutors = [
    { id: 'mc', name: 'Marta Conti', subj: 'Matematica', tone: 1, off: [10, 11] },
    { id: 'sb', name: 'Sara Bianchi', subj: 'Inglese', tone: 2, off: [] },
    { id: 'dg', name: 'Davide Greco', subj: 'Fisica e chimica', tone: 3, off: [0, 1] },
    { id: 'ev', name: 'Elena Villa', subj: 'Italiano', tone: 4, off: [] },
    { id: 'ps', name: 'Paolo Serra', subj: 'Latino e greco', tone: 5, off: [5, 6, 7] }
  ];
  const st = (id, name, grade, subject, tutor, fee, trial = null, tone) => ({ id, name, grade, subject, tutor, fee, trial, tone: tone || (hash(name) % 5) + 1, since: addDays(TODAY, trial === null ? -40 - hash(name) % 60 : -(hash(name) % 9)) });
  const students = [
    st('s1', 'Luca Ferri', '4ª Liceo', 'Matematica', 'mc', 120),
    st('s2', 'Alice Moretti', '5ª Liceo', 'Fisica', 'dg', 120),
    st('s3', 'Giorgia Costa', '3ª Liceo', 'Chimica', 'dg', 100),
    st('s4', 'Tommaso Riva', '2ª Media', 'Italiano', 'ev', 90),
    st('s5', 'Chiara Neri', '4ª Liceo', 'Latino', 'ps', 110),
    st('s6', 'Sofia Aru', '2ª Liceo', 'Inglese', 'sb', 90, 2, 2),
    st('s7', 'Leo Marino', '3ª Media', 'Matematica', 'mc', 90, 1, 3),
    st('s8', 'Nina Russo', '5ª Liceo', 'Fisica', 'dg', 120, 3, 5),
    st('s9', 'Gabriele Cara', '1ª Liceo', 'Latino', 'ps', 100, 0, 1),
    st('s10', 'Emma Ricci', '5ª Liceo', 'Matematica', 'mc', 70),
    st('s11', 'Matteo Galli', '5ª Liceo', 'Matematica', 'mc', 70),
    st('s12', 'Anna Fontana', '5ª Liceo', 'Matematica', 'mc', 70),
    st('s13', 'Pietro Longo', '4ª Liceo', 'Inglese', 'sb', 70),
    st('s14', 'Irene De Luca', '4ª Liceo', 'Inglese', 'sb', 70),
    st('s15', 'Marco Sala', '3ª Liceo', 'Inglese', 'sb', 70),
    st('s16', 'Beatrice Leone', '4ª Liceo', 'Inglese', 'sb', 70),
    st('s17', 'Filippo Gatti', '5ª Liceo', 'Inglese', 'sb', 80),
    st('s18', 'Elisa Marchi', '5ª Liceo', 'Inglese', 'sb', 80)
  ];
  const groups = [
    { id: 'g1', name: 'Gruppo 5ª', tutor: 'mc', students: ['s10', 's11', 's12'] },
    { id: 'g2', name: 'First B2', tutor: 'sb', students: ['s13', 's14', 's15', 's16'] },
    { id: 'g3', name: 'IELTS', tutor: 'sb', students: ['s17', 's18'] }
  ];
  let n = 0; const L = (tutor, start, len, kind, title, sub, students, status = 'ok') => ({ id: 'l' + (++n), date: TODAY, tutor, start, len, kind, title, sub, students, status, att: {} });
  const lessons = [
    L('mc', 2, 2, 's', 'Luca Ferri', 'Singola', ['s1']),
    L('mc', 7, 3, 'g', 'Gruppo 5ª', '', ['s10', 's11', 's12']),
    L('sb', 3, 3, 'g', 'First B2', '', ['s13', 's14', 's15', 's16']),
    L('sb', 8, 3, 'g', 'IELTS', '', ['s17', 's18']),
    L('dg', 5, 2, 's', 'Alice Moretti', 'Fisica', ['s2']),
    L('dg', 8, 2, 's', 'Giorgia Costa', 'Chimica', ['s3']),
    L('ev', 0, 2, 'v', 'Simulazione', 'Tema', ['s4']),
    L('ev', 6, 4, 's', 'Tommaso Riva', 'Singola', ['s4'], 'wait'),
    L('ps', 1, 3, 'v', 'Verifica simulata', '5ª Liceo', ['s5', 's9', 's12']),
    L('ps', 8, 4, 's', 'Chiara Neri', 'Singola', ['s5'])
  ];
  const wd = parse(TODAY).getDay();
  const nextSat = addDays(TODAY, ((6 - wd + 7) % 7) || 7);
  const nextTue = addDays(TODAY, ((2 - wd + 7) % 7) || 7);
  const events = [
    { id: 'e1', title: 'Colloquio con la famiglia Riva', desc: 'Andamento del primo mese', date: TODAY, from: 16 * 60, to: 16 * 60 + 30, place: 'Sala colloqui', people: [['ER', 4, 'Enrico Riva'], ['GR', 1, 'Giulia Rossi']] },
    { id: 'e2', title: 'Simulazione di maturità', desc: 'Seconda prova di matematica, aula Galilei', date: nextSat, from: 9 * 60, to: 13 * 60, place: 'Aula Galilei', people: [['AM', 2, 'Alice Moretti'], ['LF', 3, 'Luca Ferri']], more: 9 },
    { id: 'e3', title: 'Riunione tutor', desc: 'Calendario di novembre', date: nextTue, from: 18 * 60, to: 19 * 60, place: 'Sala docenti', people: [['MC', 1, 'Marta Conti'], ['SB', 2, 'Sara Bianchi'], ['DG', 3, 'Davide Greco']], more: 2 }
  ];
  const t = parse(TODAY);
  const off = t.getDate() > 10 ? 1 : 0;
  const cur = new Date(t.getFullYear(), t.getMonth() + off, 10), prev = new Date(t.getFullYear(), t.getMonth() + off - 1, 10);
  const quotes = [];
  students.filter(s => s.trial === null).forEach((s, i) => {
    const lateIds = ['s4', 's13', 's17'];
    quotes.push({ id: 'q' + s.id + 'p', student: s.id, period: cap(fMonth.format(prev)), due: iso(prev), amount: s.fee * 4, paid: !lateIds.includes(s.id), paidOn: lateIds.includes(s.id) ? null : iso(new Date(prev.getFullYear(), prev.getMonth(), 5 + i % 5)), reminded: null });
    const paidNow = ['s1', 's2', 's10', 's14', 's5'].includes(s.id);
    quotes.push({ id: 'q' + s.id + 'c', student: s.id, period: cap(fMonth.format(cur)), due: iso(cur), amount: s.fee * 4, paid: paidNow, paidOn: paidNow ? addDays(TODAY, -1 - i % 3) : null, reminded: null });
  });
  return {
    v: 4, seq: 100,
    settings: { theme: 'system', clock: 'auto', motion: 'system' },
    tutors, students, groups, lessons, events, quotes,
    days: { [TODAY]: { off: { mc: [10, 11], dg: [0, 1], ps: [5, 6, 7] } } },
    read: [], chat: []
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || S.v !== 4 || !S.days || !S.days[TODAY]) { const keep = S && S.settings; S = seed(); if (keep) S.settings = keep; }
let saveT;
const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 120); };
const uid = p => p + (++S.seq);
const tutor = id => S.tutors.find(t => t.id === id);
const student = id => S.students.find(s => s.id === id);
const lesson = id => S.lessons.find(l => l.id === id);

function ensureDay(date) {
  if (S.days[date]) return S.days[date];
  const d = parse(date), wd = d.getDay();
  const day = S.days[date] = { off: {} };
  if (wd === 0) { day.closed = true; return day; }
  const r = rng(hash(date));
  const past = date < TODAY;
  S.tutors.forEach(t => {
    day.off[t.id] = t.off.slice();
    const busy = new Set(t.off);
    const pool = [
      ...S.students.filter(s => s.tutor === t.id && !S.groups.some(g => g.students.includes(s.id))).map(s => ({ kind: 's', title: s.name, sub: s.subject, students: [s.id], len: 2 })),
      ...S.groups.filter(g => g.tutor === t.id).map(g => ({ kind: 'g', title: g.name, sub: '', students: g.students.slice(), len: 3 }))
    ];
    if (t.id === 'ps' || t.id === 'ev') pool.push({ kind: 'v', title: t.id === 'ps' ? 'Verifica simulata' : 'Simulazione', sub: t.id === 'ps' ? 'Versione di latino' : 'Tema', students: S.students.filter(s => s.tutor === t.id).map(s => s.id).slice(0, 3), len: 3 });
    if (!pool.length) return;
    const want = wd === 6 ? 1 : 2 + (r() < .45 ? 1 : 0);
    let placed = 0, tries = 0;
    while (placed < want && tries++ < 30) {
      const tpl = pool[Math.floor(r() * pool.length)];
      const len = tpl.len + (tpl.kind === 's' && r() < .3 ? 1 : 0);
      const start = Math.floor(r() * (SLOTS - len + 1));
      let ok = true; for (let k = start; k < start + len; k++) if (busy.has(k)) ok = false;

  if (e.touches.length > 1) { gCancel(); return; }
  const t = e.touches[0];
  const grip = e.target.closest('.grip'), les = e.target.closest('.les'), cell = e.target.closest('button.cell');
  if (grip && les) { gStart('resize', les, t.clientX, t.clientY, true); if (G) gActivate(t.clientX, t.clientY); return; }
  if (les) gStart('move', les, t.clientX, t.clientY, true);
  else if (cell) gStart('create', cell, t.clientX, t.clientY, true);
  if (!G) return;
  G.el.classList.add('pressing');
  const g = G;
  g.timer = setTimeout(() => { if (G === g && !g.on) gActivate(g.x0, g.y0); }, 320);
}
document.addEventListener('touchmove', e => {
  if (!G) return;
  const t = e.touches[0];
  if (G.on) { e.preventDefault(); gMove(t.clientX, t.clientY); }
  else gMove(t.clientX, t.clientY);
}, { passive: false });
document.addEventListener('touchend', e => {
  if (!G) return;
  clearTimeout(G.timer);
  if (G.on) { e.preventDefault(); gEnd(); } else { G.el.classList.remove('pressing'); G = null; }
}, { passive: false });
document.addEventListener('touchcancel', () => gCancel());

    : `<h3>Studenti</h3>${studs.map(s => `<button class="pop-item" data-student="${s.id}"><span class="av t${s.tone}">${initials(s.name)}</span><div><b>${esc(s.name)}</b><small>${esc(s.grade)}, ${esc(s.subject)}</small></div></button>`).join('')}`) : '';

    <div class="sheet-body">
      <div class="sheet-top"><div class="kind"><span class="tag ${kindTone[l.kind]}">${kindName[l.kind]}</span>${statusTag(l)}</div><button class="circle sm raised" data-close aria-label="Chiudi">${ic('x')}</button></div>

      <dl class="facts">

        <dt>Durata</dt><dd>${durTxt(l.len)}</dd>

        <dt>Materia</dt><dd>${esc(t.subj)}</dd>
      </dl>
      ${list}
    </div>
    <div class="sheet-foot">
      ${l.status === 'wait' && p !== 'done' ? `<button class="pill-btn primary" data-act="confirm">${ic('check')}Conferma lezione</button>` : ''}
      ${p !== 'done' ? `<button class="pill-btn ghost" data-act="edit">${ic('move')}Sposta</button>` : ''}
      <span class="grow"></span>
      ${p === 'future' ? `<button class="pill-btn danger" data-act="cancel">Annulla lezione</button>` : ''}

  $$('[data-att]', el).forEach(c => c.addEventListener('change', () => { l.att[c.dataset.att] = c.checked; save(); toast(`${student(c.dataset.att).name}: ${c.checked ? 'presente' : 'assente'}`); }));

  act('cancel', () => { l.status = 'cancelled'; save(); layer.close(true); refresh(); toast(`Lezione di ${l.title} annullata`, { action: 'Annulla', onAction: () => { l.status = 'ok'; save(); refresh(); } }); });
}
function confirmLesson(id) {

  if (el && motionOK()) el.animate([{ transform: 'scale(.96)' }, { transform: 'scale(1.03)' }, { transform: 'none' }], { duration: 560, easing: SPRING });

/* ---------- modulo lezione ---------- */
function segCtl(name, opts, val) {
  return `<div class="seg-ctl" role="group" data-seg="${name}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === val}">${l}</button>`).join('')}<span class="thumb" aria-hidden="true"></span><input type="hidden" name="${name}" value="${val}"></div>`;
}
function bindSeg(root, onChange) {
  $$('.seg-ctl', root).forEach(seg => {
    const place = (anim) => { const b = $('[aria-pressed="true"]', seg), th = $('.thumb', seg); if (!b) return; if (!anim) th.style.transition = 'none'; th.style.width = b.offsetWidth + 'px'; th.style.transform = `translateX(${b.offsetLeft}px)`; if (!anim) { th.offsetWidth; th.style.transition = ''; } };
    requestAnimationFrame(() => place(false));
    seg.addEventListener('click', e => {
      const b = e.target.closest('button[data-v]'); if (!b) return;
      $$('button[data-v]', seg).forEach(x => x.setAttribute('aria-pressed', x === b));
      $('input', seg).value = b.dataset.v; place(true);
      onChange && onChange(seg.dataset.seg, b.dataset.v);
    });
  });
}

function afterLessonSave(l, msg, undo) {

/* ---------- tutor in sede ---------- */
function tutorNow(t) {
  const n = now(), s = (n.min - OPEN) / STEP;
  const L = dayLessons(n.date).filter(l => l.tutor === t.id).sort((a, b) => a.start - b.start);
  const cur = L.find(l => s >= l.start && s < l.start + l.len);
  if (cur) return { busy: true, txt: `In lezione con ${cur.title} fino alle ${tm(slotMin(cur.start + cur.len))}` };
  const next = L.find(l => l.start > s);
  if (offOf(n.date, t.id).includes(Math.floor(s))) return { busy: true, txt: 'Non disponibile in questo momento' };
  if (next) return { busy: false, txt: `Libero fino alle ${tm(slotMin(next.start))}` };
  return { busy: false, txt: s < 0 ? 'Arriva alle 14:00' : 'Nessun’altra lezione oggi' };
}

  const st = tutorNow(t);
  const layer = openSheet(`
    <div class="sheet-body">

function eventTag(ev) {
  const n = now();
  if (ev.date === n.date) {
    if (n.min >= ev.from && n.min < ev.to) return 'In corso';
    if (ev.from > n.min) { const m = Math.round(ev.from - n.min); return cap(m < 60 ? fRel.format(m, 'minute') : fRel.format(Math.round(m / 60), 'hour')); }
    return 'Concluso';
  }
  const days = Math.round((parse(ev.date) - parse(n.date)) / 864e5);
  return cap(fRel.format(days, 'day'));
}
function renderEvents() {
  const n = now();
  const up = S.events.filter(ev => ev.date > n.date || (ev.date === n.date && ev.to > n.min)).sort((a, b) => (a.date + pad(a.from)).localeCompare(b.date + pad(b.from)));
  const box = $('#events');
  if (!up.length) { box.innerHTML = `<div class="empty"><b>Nessun impegno in arrivo</b>Gli impegni che aggiungi al calendario compaiono qui.</div>`; return; }

    const soon = ev.date === n.date && ev.from - n.min <= 60;

      ${i < 2 ? `<div class="e-bot"><span class="chip">${ic('clock')}${tm(ev.from)}–${tm(ev.to)}</span><span class="chip">${ic('cal')}${dateTxt}</span><span class="stack" aria-hidden="true">${ev.people.map(p => `<span class="av t${p[1]}">${p[0]}</span>`).join('')}${ev.more ? `<span class="av more">+${ev.more}</span>` : ''}</span></div>` : ''}
    </button>`;

  $$('[data-ev]', box).forEach(b => b.addEventListener('click', () => openEvent(b.dataset.ev)));
}
function openEvent(id) {

/* ================= report ================= */
function weekStats(mon) {
  const days = Array.from({ length: 6 }, (_, i) => addDays(mon, i)); days.forEach(ensureDay);
  const per = days.map(d => { const L = dayLessons(d); const done = L.filter(l => phase(l) === 'done'); return { d, sched: L.length, done: done.length, L, doneL: done }; });
  const all = per.flatMap(p => p.L), done = per.flatMap(p => p.doneL);
  let pres = 0, seats = 0; const absent = [];
  done.forEach(l => l.students.forEach(sid => { seats++; if (l.att[sid] !== false) pres++; else absent.push({ sid, l }); }));
  const hours = S.tutors.map(t => ({ t, h: all.filter(l => l.tutor === t.id).reduce((a, l) => a + l.len, 0) / 2 }));
  return { per, sched: all.length, done: done.length, rate: seats ? pres / seats : 1, hours, absent, totH: hours.reduce((a, x) => a + x.h, 0) };
}

function drawConvo(root) {
  const c = $('.convo', root);

  const known = +(c.dataset.n || 0);
  if (known > S.chat.length || !known) c.innerHTML = '';
  const start = c.children.length ? $$('.msg:not(.typing)', c).length : 0;
  $$('.typing', c).forEach(x => x.remove());
  S.chat.slice(start).forEach(m => { const d = document.createElement('div'); d.className = 'msg ' + (m.role === 'me' ? 'from-me' : 'bot'); d.innerHTML = m.html; c.appendChild(d); });
  c.dataset.n = S.chat.length;
  if (root.classList.contains('thinking')) { const t = document.createElement('div'); t.className = 'msg bot typing'; t.setAttribute('aria-label', 'L’assistente sta scrivendo…'); t.innerHTML = '<i></i><i></i><i></i>'; c.appendChild(t); }
  c.scrollTop = c.scrollHeight;
}
function refreshAssist() { assists.forEach(r => document.contains(r) ? drawConvo(r) : assists.delete(r)); }
function ask(text, file) {
  S.chat.push({ role: 'me', html: esc(text) + (file ? `<br><small style="opacity:.8">Allegato: ${esc(file)}</small>` : '') });
  assists.forEach(r => r.classList.add('thinking')); refreshAssist();
  setTimeout(() => {
    S.chat.push({ role: 'bot', html: answer(text, file) }); save();
    assists.forEach(r => r.classList.remove('thinking')); refreshAssist();
  }, motionOK() ? 700 + Math.random() * 400 : 150);
}
const btn = (label, data) => `<button class="pill-btn" ${Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ')}>${esc(label)}</button>`;
function answer(raw, file) {

function renderAssistente() {
  const v = $('#v-assistente');
  if (!v.dataset.built) { v.innerHTML = `<section class="module assist" data-assist="page"></section>`; v.dataset.built = '1'; mountAssist($('[data-assist]', v)); }
  else refreshAssist();
}

/* ================= ricerca rapida ================= */
function openCmd() {
  closeAll();
  const layer = openModal(`<div class="cmd-input">${ic('search')}<label class="sr" for="cmdQ">Cerca</label><input id="cmdQ" type="search" name="cerca" placeholder="Cerca studenti, tutor, lezioni o azioni…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="cmdRes" autofocus><kbd>Esc</kbd></div><div class="cmd-res" id="cmdRes" role="listbox" aria-label="Risultati"></div>`, { cls: 'cmd' });
  const el = layer.el, inp = $('#cmdQ', el), res = $('#cmdRes', el);
  let items = [], sel = 0;
  const actions = [
    ['Nuova lezione', 'plus', () => lessonForm()], ['Aggiungi studente', 'user', () => { go('studenti'); setTimeout(studentForm, 80); }],
    ['Vai a oggi', 'home', () => go('oggi')], ['Vai alla settimana', 'cal', () => go('settimana')], ['Vai al report presenze', 'chart', () => go('report')],
    ['Vai alle quote', 'wallet', () => go('quote')], ['Apri l’assistente', 'spark', () => go('assistente')], ['Cambia tema', 'moon', () => toggleTheme()]
  ];
  function draw() {
    const q = inp.value.trim().toLowerCase();
    const m = s => !q || s.toLowerCase().includes(q);
    const groups = [
      ['Azioni', actions.filter(a => m(a[0])).map(a => ({ label: a[0], sub: '', icon: a[1], run: a[2] }))],
      ['Studenti', S.students.filter(s => q && m(s.name + ' ' + s.subject)).slice(0, 6).map(s => ({ label: s.name, sub: `${s.grade}, ${s.subject.toLowerCase()}`, av: s, run: () => openStudent(s.id) }))],
      ['Tutor', S.tutors.filter(t => q && m(t.name + ' ' + t.subj)).map(t => ({ label: t.name, sub: t.subj, av: t, run: () => openTutor(t.id) }))],
      ['Lezioni di oggi', dayLessons(TODAY).filter(l => q && m(l.title + ' ' + tutor(l.tutor).name)).map(l => ({ label: l.title, sub: `${range(l)} con ${tutor(l.tutor).name}`, icon: kindIcon[l.kind], run: () => { if (R.name !== 'oggi') go('oggi'); setTimeout(() => openLesson(l.id), 60); } }))]
    ].filter(g => g[1].length);
    items = groups.flatMap(g => g[1]); sel = 0;
    res.innerHTML = items.length ? groups.map(([h, arr]) => `<h3>${h}</h3>${arr.map(it => { const i = items.indexOf(it); return `<button class="pop-item" role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === 0}">${it.av ? `<span class="av t${it.av.tone}">${initials(it.av.name)}</span>` : `<span class="ic">${ic(it.icon)}</span>`}<div><b>${esc(it.label)}</b>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</div></button>`; }).join('')}`).join('') : `<div class="empty"><b>Nessun risultato per “${esc(inp.value)}”</b>Prova con il nome di uno studente, di un tutor o di un gruppo.</div>`;
    inp.setAttribute('aria-activedescendant', items.length ? 'opt-0' : '');
  }
  const pick = i => { const it = items[i]; if (!it) return; layer.close(true); setTimeout(it.run, 40); };
  const mark = () => { $$('[data-i]', res).forEach(b => b.setAttribute('aria-selected', +b.dataset.i === sel)); const c = $(`[data-i="${sel}"]`, res); if (c) { c.scrollIntoView({ block: 'nearest' }); inp.setAttribute('aria-activedescendant', c.id); } };
  inp.addEventListener('input', draw);
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); mark(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); mark(); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(sel); }
  });
  res.addEventListener('click', e => { const b = e.target.closest('[data-i]'); b && pick(+b.dataset.i); });
  draw();
}
$('#openCmd').addEventListener('click', openCmd);
$('#kbdHint').innerHTML = isMac ? '⌘&nbsp;K' : 'Ctrl&nbsp;K';
$('#newLesson').addEventListener('click', () => lessonForm());
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); return; }
  if (typing || stack.length || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); openCmd(); }
  else if (e.key.toLowerCase() === 'n') { e.preventDefault(); lessonForm(); }
  else if (R.name === 'oggi' && (e.key === '[' || e.key === ']')) shiftDay(e.key === ']' ? 1 : -1);
});

/* ================= notifiche ================= */
function notes() {
  const n = [];
  S.lessons.filter(l => l.status === 'wait' && l.date >= TODAY && phase(l) !== 'done').slice(0, 2).forEach(l => n.push({ id: 'w' + l.id, who: l.title, tone: 5, title: `${l.title}: lezione da confermare`, sub: `${l.date === TODAY ? 'Oggi' : cap(fDayShort.format(parse(l.date)))} alle ${tm(slotMin(l.start))} con ${tutor(l.tutor).name}`, run: () => { if (l.date !== selDate() || R.name !== 'oggi') go('oggi', l.date === TODAY ? {} : { d: l.date }); setTimeout(() => openLesson(l.id), 80); } }));
  const late = S.quotes.filter(q => quoteState(q) === 'late');
  if (late.length) n.push({ id: 'late' + late.length, who: '€', tone: 4, title: `${late.length} quote in ritardo`, sub: 'Invia un promemoria alle famiglie', run: () => go('quote', { f: 'ritardo' }) });
  S.students.filter(s => s.trial >= 3).forEach(s => n.push({ id: 'tr' + s.id, who: initials(s.name), tone: s.tone, title: `${s.name} ha finito le lezioni di prova`, sub: 'Puoi iscriverlo dalla sua scheda', run: () => openStudent(s.id) }));
  return n;
}
function updateBell() { const unread = notes().filter(x => !S.read.includes(x.id)).length; $('#bellDot').classList.toggle('on', unread > 0); $('#openBell').setAttribute('aria-label', unread ? `Notifiche, ${unread} da leggere` : 'Notifiche'); }
$('#openBell').addEventListener('click', e => {
  const N = notes();
  const layer = openPop(e.currentTarget, `<h2>Notifiche ${N.length ? '<button id="readAll">Segna tutte come lette</button>' : ''}</h2><div class="pop-list">${N.length ? N.map(x => `<button class="pop-item" data-n="${x.id}"><span class="av t${x.tone}">${esc(x.who.length > 2 ? initials(x.who) : x.who)}</span><div><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></div><span class="ud ${S.read.includes(x.id) ? 'read' : ''}" aria-label="${S.read.includes(x.id) ? 'Letta' : 'Da leggere'}"></span></button>`).join('') : '<div class="empty"><b>Nessuna notifica</b>Qui compaiono conferme mancanti, quote in ritardo e prove concluse.</div>'}</div>`, 'Notifiche');
  if (!layer) return;
  $$('[data-n]', layer.el).forEach(b => b.addEventListener('click', () => { const x = N.find(y => y.id === b.dataset.n); if (!S.read.includes(x.id)) S.read.push(x.id); save(); updateBell(); layer.close(true); x.run(); }));
  const ra = $('#readAll', layer.el); ra && ra.addEventListener('click', () => { N.forEach(x => S.read.includes(x.id) || S.read.push(x.id)); save(); updateBell(); $$('.ud', layer.el).forEach(u => u.classList.add('read')); });
});

/* ================= tema ================= */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $$('meta[name="theme-color"]').forEach(m => m.setAttribute('content', t === 'dark' ? '#0A0B0E' : '#D9DBE1'));
  $('#theme').setAttribute('aria-label', t === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro');
}
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  S.settings.theme = next; save();
  const b = $('#theme').getBoundingClientRect(), r = document.documentElement;
  if (document.startViewTransition && motionOK()) {
    const x = b.left + b.width / 2, y = b.top + b.height / 2;
    r.style.setProperty('--vx', x + 'px'); r.style.setProperty('--vy', y + 'px');
    r.style.setProperty('--vr', Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 'px');
    r.classList.add('vt-theme');
    const vt = document.startViewTransition(() => applyTheme(next));
    vt.finished.finally(() => r.classList.remove('vt-theme'));
  } else applyTheme(next);
  if (R.name === 'impostazioni') renderImpostazioni();
}
$('#theme').addEventListener('click', toggleTheme);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { if (S.settings.theme === 'system') applyTheme(e.matches ? 'dark' : 'light'); });

/* ================= avvio ================= */
const render = { oggi: renderOggi, settimana: renderSettimana, studenti: renderStudenti, report: renderReport, quote: renderQuote, assistente: renderAssistente, impostazioni: renderImpostazioni };
applyTheme(document.documentElement.getAttribute('data-theme'));
renderPeople();
updateBell();
route();
const root = document.documentElement;
function boot() {
  if (R.name !== 'oggi' || !motionOK()) { root.classList.remove('boot'); bootDone = true; scrollToNow(); return; }
  scrollToNow();
  const line = $('.nowline');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.classList.add('enter'); root.classList.remove('boot');
    if (line) line.style.transitionDelay = '520ms';
    setTimeout(() => { root.classList.remove('enter'); bootDone = true; if (line) line.style.transitionDelay = ''; }, 2000);
  }));
}
if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 400))]).then(boot); else boot();
setInterval(() => {
  if (R.name === 'oggi') {
    if (sig() !== lastSig) { bootDone = true; renderPlanner(); }
    else { const n = now(), ns = (n.min - OPEN) / STEP, line = $('.nowline'); if (line && selDate() === n.date) { line.style.setProperty('--t', Math.min(Math.max(ns / SLOTS, 0), 1)); line.style.setProperty('--g', Math.min(Math.floor(Math.max(ns, 0)), 11) * 8 + 'px'); } }
    renderEvents();
  }
  updateBell();
}, 15000);
})();

</script>
