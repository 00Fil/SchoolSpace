<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#D9DBE1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0B0E" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%2216%22 fill=%22%23ECEDF1%22/%3E%3Crect x=%229%22 y=%2212%22 width=%223.5%22 height=%2210%22 rx=%221.75%22 fill=%22%234F7CF7%22/%3E%3Crect x=%2214.25%22 y=%228%22 width=%223.5%22 height=%2214%22 rx=%221.75%22 fill=%22%234F7CF7%22/%3E%3Crect x=%2219.5%22 y=%2210%22 width=%223.5%22 height=%2212%22 rx=%221.75%22 fill=%22%234F7CF7%22/%3E%3C/svg%3E" />
    <title>Centro ripetizioni</title>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem("ripetizioni-ui") || "{}"), t = p.theme || "system";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        if (p.motion === "reduce") document.documentElement.classList.add("reduce");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="layers"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
