# Nginx non privilegiato (uid 101): pid e file temporanei in /tmp, porte 8080/8443.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_max_body_size 1m;          # uguale a DATA_UPLOAD_MAX_MEMORY_SIZE (PYSEC-2026-3827)
  client_body_timeout 15s;
  client_header_timeout 15s;
  large_client_header_buffers 4 8k;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Access log JSON senza query string, cookie o header di autenticazione (GAP-I07).
  log_format json_safe escape=json
    '{"ts":"$time_iso8601","logger":"nginx.access","correlation_id":"$req_id",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"duration_ms":$request_time,"upstream_ms":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"tls":"$ssl_protocol"}';
  access_log /dev/stdout json_safe;

  # correlation_id: si accetta X-Request-ID solo se "sicuro", altrimenti quello di nginx.
  map $http_x_request_id $req_id {
    "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
    default                    $request_id;
  }
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  # Limiti anti-abuso (in aggiunta al throttle applicativo condiviso in Redis).
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  upstream web {
    # Alias privato (compose: networks.backend.aliases), mai il generico "web".
    server ripetizioni-web:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  include /etc/nginx/conf.d/*.conf;
}
