# Location applicative comuni ai server HTTP (solo senza TLS: sviluppo/e2e) e HTTPS.

# Pagina di manutenzione: attiva se esiste /srv/maintenance/on (scripts/maintenance.sh).
set $maintenance 0;
if (-f /srv/maintenance/on) { set $maintenance 1; }
error_page 503 @maintenance;
error_page 502 504 @upstream_down;

location @maintenance {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Retry-After "600" always;
  add_header Cache-Control "no-store" always;
  root /srv/maintenance-page;
  rewrite ^ /index.html break;
}
location @upstream_down {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Retry-After "60" always;
  add_header Cache-Control "no-store" always;
  default_type application/json;
  return 503 '{"code":"SERVICE_UNAVAILABLE","message":"Servizio temporaneamente non disponibile"}';
}

# Endpoint di esercizio interni: mai esposti su Internet (scrape e probe sulla rete privata).
location ~ ^/(metrics|healthz|readyz)$ { return 404; }

location = /api/v1/ready {
  include /etc/nginx/snippets/security-headers.conf;
  proxy_pass http://web;
  include /etc/nginx/snippets/proxy.conf;
  access_log off;
}

location = /api/v1/auth/login {
  if ($maintenance) { return 503; }
  include /etc/nginx/snippets/security-headers.conf;
  limit_req zone=login burst=5 nodelay;
  proxy_pass http://web;
  include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
  if ($maintenance) { return 503; }
  include /etc/nginx/snippets/security-headers.conf;
  limit_req zone=api burst=40 nodelay;
  limit_conn perip 30;
  proxy_pass http://web;
  include /etc/nginx/snippets/proxy.conf;
}

# Admin Django: chiuso salvo allowlist di rete (GAP-I06); vedi ADMIN_ALLOW_CIDRS.
location /admin/ {
  include /etc/nginx/conf.d/runtime/admin-allow.inc;
  deny all;
  include /etc/nginx/snippets/security-headers.conf;
  proxy_pass http://web;
  include /etc/nginx/snippets/proxy.conf;
}
location /static/ {
  include /etc/nginx/snippets/security-headers.conf;
  alias /srv/static/;
  add_header Cache-Control "public, max-age=86400" always;
}

# Asset Vite con hash nel nome: cache lunga e immutabile.
location /assets/ {
  if ($maintenance) { return 503; }
  include /etc/nginx/snippets/security-headers.conf;
  root /srv/frontend;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

location / {
  if ($maintenance) { return 503; }
  include /etc/nginx/snippets/security-headers.conf;
  root /srv/frontend;
  add_header Cache-Control "no-cache" always;
  try_files $uri /index.html;
}
