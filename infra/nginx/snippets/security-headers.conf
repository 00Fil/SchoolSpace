# Header di sicurezza comuni (GAP-I02, GAP-J03). Va incluso in OGNI location che usa
# add_header, perché nginx non eredita gli add_header del livello superiore.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# Permissions-Policy generata a runtime: camera/microfono delegati solo a VIDEO_ORIGIN (v0.10).
include /etc/nginx/conf.d/runtime/permissions.inc;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Request-ID $req_id always;
include /etc/nginx/conf.d/runtime/csp.inc;
include /etc/nginx/conf.d/runtime/hsts.inc;
