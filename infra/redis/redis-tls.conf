# Redis 7 privato (GAP-J04): solo TLS, autenticazione ACL, nessuna persistenza.
# Redis è un trasporto: job, outbox e lease stanno in PostgreSQL e il reconciler li ricostruisce.
port 0
tls-port 6380
tls-cert-file /tls/redis.crt
tls-key-file /tls/redis.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients optional
tls-protocols "TLSv1.2 TLSv1.3"
tls-prefer-server-ciphers yes
bind 0.0.0.0
protected-mode yes
aclfile /usr/local/etc/redis/users.acl
save ""
appendonly no
# Il broker non deve perdere messaggi per eviction: memoria piena = errore visibile (alert).
maxmemory 256mb
maxmemory-policy noeviction
timeout 300
tcp-keepalive 60
latency-monitor-threshold 100
slowlog-log-slower-than 10000
